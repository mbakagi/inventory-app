<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="ST3S Inventory - Fire panels, detectors, access control, sirens">
  <meta name="theme-color" content="#b71c1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ST3S Inventory">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>ST3S Inventory</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <button id="backBtn" class="icon-btn hidden" title="Back">←</button>
      <h1 id="headerTitle">ST3S Inventory</h1>
      <button id="menuBtn" class="icon-btn" title="Menu">☰</button>
    </header>

    <!-- Screens -->
    <main id="main">
      <!-- Home Screen -->
      <section id="screen-home" class="screen active">
        <div class="card setup-card">
          <div class="setup-row">
            <span class="setup-icon">👤</span>
            <div class="setup-info">
              <strong id="displayName">Set your name</strong>
              <small id="displayDepot">No depot selected</small>
            </div>
            <button id="setupBtn" class="btn-sm">Edit</button>
          </div>
        </div>
        <div class="actions">
          <button class="action-card" data-screen="count">
            <span class="action-icon">📷</span>
            <div>
              <strong>Count Mode</strong>
              <small>Scan barcodes or use camera OCR</small>
            </div>
            <span class="action-arrow">›</span>
          </button>
          <button class="action-card" data-screen="catalog">
            <span class="action-icon">📦</span>
            <div>
              <strong>Product Catalog</strong>
              <small id="catalogCount">Loading products...</small>
            </div>
            <span class="action-arrow">›</span>
          </button>
          <button class="action-card" data-screen="sessions">
            <span class="action-icon">📋</span>
            <div>
              <strong>Count Sessions</strong>
              <small>View, export and merge counts</small>
            </div>
            <span class="action-arrow">›</span>
          </button>
        </div>
      </section>

      <!-- Count Screen -->
      <section id="screen-count" class="screen">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Type reference or name..." autocomplete="off">
          <button id="ocrBtn" class="btn" title="OCR Photo">📷 OCR</button>
        </div>
        <div id="scannerContainer">
          <div id="scannerView"></div>
          <button id="toggleScanner" class="btn full">Start Scanner</button>
        </div>
        <div id="lastScanned" class="last-scanned hidden"></div>
        <div class="summary-bar">
          <span id="itemCount">0 items</span>
          <span id="totalCount">0 total</span>
        </div>
        <div id="entriesList" class="entries-list"></div>
        <button id="saveSession" class="btn primary full">💾 Save Session</button>
      </section>

      <!-- Catalog Screen -->
      <section id="screen-catalog" class="screen">
        <div class="search-bar">
          <input type="text" id="catalogSearch" placeholder="Search products..." autocomplete="off">
        </div>
        <div class="filter-row">
          <select id="brandFilter"><option value="">All Brands</option></select>
          <select id="familyFilter"><option value="">All Families</option></select>
        </div>
        <div id="catalogList" class="catalog-list"></div>
      </section>

      <!-- Sessions Screen -->
      <section id="screen-sessions" class="screen">
        <div class="toolbar">
          <button id="importExcel" class="btn">📥 Import Excel</button>
        </div>
        <div id="sessionsList" class="sessions-list"></div>
      </section>

      <!-- Session Detail Screen -->
      <section id="screen-session-detail" class="screen">
        <div id="sessionDetailInfo" class="detail-info"></div>
        <div id="sessionDetailEntries" class="entries-list"></div>
        <div class="detail-actions">
          <button id="exportExcel" class="btn">📤 Export Excel</button>
          <button id="deleteSession" class="btn danger">🗑 Delete</button>
        </div>
      </section>
    </main>

    <!-- Setup Dialog -->
    <div id="setupDialog" class="dialog-overlay hidden">
      <div class="dialog">
        <h2>Setup</h2>
        <label>Your name</label>
        <input type="text" id="setupName" placeholder="Enter your name">
        <label>Depot name</label>
        <input type="text" id="setupDepot" placeholder="Enter depot name">
        <div class="dialog-actions">
          <button id="setupCancel" class="btn">Cancel</button>
          <button id="setupSave" class="btn primary">Save</button>
        </div>
      </div>
    </div>

    <!-- OCR Progress Dialog -->
    <div id="ocrDialog" class="dialog-overlay hidden">
      <div class="dialog ocr-dialog">
        <div class="spinner"></div>
        <p id="ocrStatus">Processing image...</p>
        <progress id="ocrProgress" value="0" max="100"></progress>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- App Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/fuzzy.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
